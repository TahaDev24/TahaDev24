  .blink{animation:blink 3s ease-in-out infinite}
  .float{animation:float 4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55;filter:drop-shadow(0 0 3px #168cff)}50%{opacity:1;filter:drop-shadow(0 0 13px #25bfff)}}
  @keyframes sweep{0%{transform:translateX(-650px)}100%{transform:translateX(1750px)}}
  @keyframes blink{0%,88%,100%{opacity:.35}92%{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 </style>
</defs>
