 <linearGradient id="beam"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#6bdcff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
