 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#bfc5ce"/><stop offset=".58" stop-color="#59616d"/><stop offset=".82" stop-color="#f4f6f8"/><stop offset="1" stop-color="#727b88"/></linearGradient>
